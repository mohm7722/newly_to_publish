# ============================================================================
# Nginx reverse proxy for Newly store on aaPanel  (www.newlyye.com)
# ----------------------------------------------------------------------------
#   https://www.newlyye.com/           -> storefront  (Next.js on 127.0.0.1:8000)
#   https://www.newlyye.com/app        -> Medusa admin dashboard (127.0.0.1:9000)
#   https://www.newlyye.com/store|/admin|/auth|/health|/static|/key-exchange|/hooks
#                                      -> Medusa API (127.0.0.1:9000)
#   https://newlyye.com/*              -> 301 redirect to the www host
#
# HOW TO USE THIS ON aaPanel
# --------------------------
# 1. In aaPanel create a Website for the domains:  www.newlyye.com  newlyye.com
# 2. Issue a Let's Encrypt certificate for that site and turn on "Force HTTPS".
#    aaPanel then manages the `listen 443 ssl`, certificate paths, and the
#    HTTP->HTTPS redirect for you - do NOT duplicate those here.
# 3. Open the site's config (Website > <domain> > Config) and paste ONLY the
#    reverse-proxy LOCATION BLOCKS below, inside the existing `server { ... }`
#    that aaPanel generated for port 443. Place them ABOVE aaPanel's default
#    `location / { ... }` (or replace that default `location /`).
# 4. Also set, inside that server block:   client_max_body_size 25m;
# 5. Save, then Service > Reload in aaPanel's Nginx panel.
#
# The FULL SERVER BLOCK further down is a complete reference for anyone who
# edits Nginx directly (not through aaPanel's managed SSL).
# ============================================================================


# ---------------------------------------------------------------------------
# (A) REVERSE-PROXY LOCATION BLOCKS  --  paste these into the aaPanel 443 site
# ---------------------------------------------------------------------------

# Allow larger uploads (product images, bank-transfer proofs, invoices, ...)
client_max_body_size 25m;

# ---- Medusa backend: admin UI, admin/store/auth APIs, health, uploads ----
location ~ ^/(app|admin|store|auth|health|key-exchange|static|hooks)(/|$) {
    proxy_pass http://127.0.0.1:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
}

# ---- Storefront (Next.js): everything else ----
location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
}


