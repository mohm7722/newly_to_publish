# Nginx reverse proxy for the Newly store (single-server deployment).
#
#   http://<host>/            -> storefront (Next.js on :8000)
#   http://<host>/app         -> Medusa admin dashboard (:9000)
#   http://<host>/admin|store|auth|health|... -> Medusa API (:9000)
#
# Place at /etc/nginx/sites-available/newly and symlink into sites-enabled.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Allow larger uploads (product images, invoices, etc.)
    client_max_body_size 25m;

    # ---- Medusa backend: admin UI, admin/store/auth APIs, health, uploads ----
    location ~ ^/(app|admin|store|auth|health|key-exchange|static|hooks)(/|$) {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # ---- Storefront (Next.js): everything else ----
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
